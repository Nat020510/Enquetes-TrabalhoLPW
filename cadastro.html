
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | VOCIFY</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <main class="cadastro-main">

        <section class="cadastro-container">

            <div class="cadastro-logo">
                <img src="imgs/LogoVocify.png" alt="Logo VOCIFY">
                <p>Sua voz. Sua opinião. Sua escolha.</p>
            </div>

            <div class="cadastro-conteudo">
                <h1>Criar conta</h1>
                <p>Faça seu cadastro para participar das enquetes!</p>
            </div>

            <form id="formCadastro">

                <div class="campo">
                    <label for="nome" class="campo__rotulo">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        class="campo__entrada"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email" class="campo__rotulo">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="campo__entrada"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha" class="campo__rotulo">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        class="campo__entrada"
                        placeholder="Crie uma senha"
                        required
                    >
                </div>

                <button type="submit" class="btn btn--primario cadastro-botao">
                    Cadastrar
                </button>

            </form>

            <p class="login-link">
                Já tem uma conta?
                <a href="login.html">Faça login</a>
            </p>

        </section>

    </main>

    <script src="cadastro.js"></script>

</body>
</html>
