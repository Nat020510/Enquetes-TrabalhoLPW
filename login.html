
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | VOCIFY</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="css/global.css">

    <!-- CSS DO LOGIN -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-main">

        <section class="login-container">

            <!-- LOGO -->
            <div class="login-logo">
                <img src="imgs/LogoVocify.png" alt="Logo VOCIFY">

                <p>Sua voz. Sua opinião. Sua escolha.</p>
            </div>

            <!-- INTRODUÇÃO -->
            <div class="login-conteudo">
                <h2>Bem-vindo de volta!</h2>

                <p>Entre na sua conta para continuar.</p>
            </div>

            <!-- FORMULÁRIO -->
            <form id="formLogin">

                <div class="campo">
                    <label for="email" class="campo__rotulo">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="campo__entrada"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="senha" class="campo__rotulo">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        class="campo__entrada"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit" class="btn btn--primario login-botao">
                    Entrar
                </button>

            </form>

            <!-- LINK PARA CADASTRO -->
            <p class="cadastro">
                Ainda não tem uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

        </section>

    </main>

    <script src="login.js"></script>

</body>
</html>
