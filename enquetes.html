
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquetes | VOCIFY</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="enquetes.css">

    <link rel="icon" type="image/png" href="imgs/Favicon.png">
</head>

<body>

    <header id="cabecalho-site"></header>

    <main class="pagina-enquetes">

        <section class="cabecalho-enquetes">
            <h1>Explore as enquetes!</h1>
            <p>Descubra opiniões, participe e compartilhe a sua</p>
        </section>

        <section class="filtros-enquetes">

            <label for="filtroCategoria">Filtrar por categoria:</label>

            <select id="filtroCategoria">
                <option value="todas">Todas as categorias</option>
            </select>

        </section>

        <section id="listaEnquetes" class="lista-enquetes">

            <!-- As enquetes serão adicionadas pelo JavaScript -->

        </section>

        <section id="mensagemVazia" class="mensagem-vazia" hidden>
            <h2>Nenhuma enquete encontrada!</h2>
            <p>Que tal criar a primeira?</p>
            <a href="criar-enquete.html">Criar enquete</a>
        </section>

    </main>

    <script src="js/global.js" defer></script>
    <script src="enquetes.js" defer></script>

</body>
</html>
