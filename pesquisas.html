<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisas | VOCIFY</title>

    <link rel="stylesheet" href="pesquisas.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="imgs/LogoVocify.png" alt="Logo VOCIFY">
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="pesquisas.html">Pesquisas</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>

    <main>

        <section class="introducao">
            <h1>Pesquisas disponíveis</h1>
            <p>Participe das enquetes e compartilhe sua opinião!</p>
        </section>

        <section class="filtros">

            <input
                type="text"
                id="campoPesquisa"
                placeholder="Pesquisar enquete..."
            >

            <select id="filtroCategoria">
                <option value="">Todas as categorias</option>
            </select>

        </section>

        <section class="lista-pesquisas" id="listaPesquisas">

    <div class="card-pesquisa">
        <span class="categoria">Entretenimento</span>

        <h2>Qual é sua série favorita?</h2>

        <p>Vote na sua série favorita e compartilhe sua opinião!</p>

        <button>Participar</button>
    </div>

</section>

    </main>

    <script src="pesquisas.js"></script>

</body>
</html>
