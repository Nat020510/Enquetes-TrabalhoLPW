<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VOCIFY | Sua voz, sua escolha</title>
</head>

<body>

    <header>
        <h1>VOCIFY<span>.</span></h1>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#enquetes">Enquetes</a>
            <a href="#criar">Criar enquete</a>
            <a href="#sobre">Sobre</a>
        </nav>
    </header>

    <main>

        <section id="inicio">
            <h2>Sua voz. Sua escolha.</h2>

            <p>
                Crie enquetes, compartilhe opiniões
                e descubra o que todos pensam.
            </p>

            <a href="#criar">Criar minha enquete</a>
        </section>

        <section id="enquetes">
            <h2>Enquetes disponíveis</h2>

            <p>
                Participe das enquetes e compartilhe
                sua opinião.
            </p>
        </section>

        <section id="criar">
            <h2>Crie sua enquete</h2>

            <form>
                <label for="pergunta">Digite sua pergunta:</label>
                <input
                    type="text"
                    id="pergunta"
                    placeholder="Escreva sua pergunta"
                    required
                >

                <label for="categoria">Escolha uma categoria:</label>
                <select id="categoria">
                    <option value="Escola">Escola</option>
                    <option value="Música">Música</option>
                    <option value="Entretenimento">Entretenimento</option>
                    <option value="Cotidiano">Cotidiano</option>
                </select>

                <label for="alternativa1">Primeira alternativa:</label>
                <input
                    type="text"
                    id="alternativa1"
                    placeholder="Alternativa 1"
                    required
                >

                <label for="alternativa2">Segunda alternativa:</label>
                <input
                    type="text"
                    id="alternativa2"
                    placeholder="Alternativa 2"
                    required
                >

                <button type="submit">Publicar enquete</button>
            </form>
        </section>

    </main>

    <footer id="sobre">
        <p>VOCIFY © 2026</p>
        <p>Sua voz, sua escolha.</p>
    </footer>

</body>
</html>
